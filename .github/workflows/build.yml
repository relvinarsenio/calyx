name: Build Static Binary

on:
  push:
    branches: [ master, development ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ master, development ]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Dockerfile changes
        id: changed-files
        uses: dorny/paths-filter@v4
        with:
          filters: |
            any_changed:
              - 'Dockerfile'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Static Binary
        env:
          DOCKERFILE_CHANGED: ${{ steps.changed-files.outputs.any_changed }}
        run: |
          chmod +x build-static.sh
          if [[ "$DOCKERFILE_CHANGED" == "true" ]]; then
            ./build-static.sh --platform ${{ matrix.platform }} --rebuild-image
          else
            ./build-static.sh --platform ${{ matrix.platform }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: calyx-static-${{ matrix.arch }}
          path: dist/calyx
          if-no-files-found: error
          retention-days: 7
